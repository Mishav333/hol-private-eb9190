<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u;}
  var f=document.getElementById('gf'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
  f.addEventListener('submit',function(e){
    e.preventDefault();err.textContent='';go.textContent='Opening';
    var enc=new TextEncoder();
    crypto.subtle.importKey('raw',enc.encode(pw.value),'PBKDF2',false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.salt),iterations:P.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},key,b(P.ct));
    }).then(function(buf){
      var c=JSON.parse(new TextDecoder().decode(buf));
      document.title='House of Longevity: Beyond the title';
      document.body.innerHTML=c.html;
      var s=document.createElement('script');s.textContent=c.js;document.body.appendChild(s);
      window.scrollTo(0,0);
    }).catch(function(){
      go.textContent='Open';err.textContent='That passphrase did not open the page. Check it and try again.';
      f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');pw.select();
    });
  });
})();
</script>
